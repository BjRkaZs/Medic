<div class="parent">
    <div class="container">
      <form [formGroup]="resetForm">
        <h1>{{'passreset.h1' | translate}}</h1>
        <div class="mb-3">
          <div class="extras">
            <div class="extra-row">
              <label for="password">{{'passreset.pass' | translate}}</label>
              <input type="password" id="password" formControlName="password" placeholder="{{'passreset.enterpass' | translate}}">
            </div>
            <div class="extra-row">
              <label for="password_confirmation">{{'log.cpass' | translate}}</label>
              <input type="password" id="password_confirmation" formControlName="password_confirmation" placeholder="{{'passreset.entercpass' | translate}}">
            </div>
          </div>
        </div>
        <div class="button-container">
          <button (click)="resetPassword()">{{'passreset.reset' | translate}}</button>
          <button routerLink="/signin">{{'fpass.back' | translate}}</button>
        </div>
      </form>
    </div>
  </div>

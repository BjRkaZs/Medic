<div class="parent">
  <div class="container">
    <form [formGroup]="resetPasswordForm">
      <h1>{{'fpass.h1' | translate}}</h1>
      <div class="mb-3">
        <div class="extras">
          <div class="extra-row">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" 
                   placeholder="{{'fpass.email' | translate}}" formControlName="email">
          </div>
        </div>
      </div>
      <div class="button-container">
        <button id="send" (click)="requestReset()">{{'fpass.send' | translate}}</button>
        <button routerLink="/signin">{{'fpass.back' | translate}}</button>
      </div>
    </form>
  </div>
</div>

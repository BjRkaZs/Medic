<div class="parent" *ngIf="isLoggedIn && isAdmin">    
  <div class="container mt-4">
    <form (ngSubmit)="addMedicine()">
      <div class="form-group">
        <input id="name" name="name" class="form-control" placeholder="{{'log.name' | translate}}" 
                [(ngModel)]="addModel.name" required />
        <input id="form" name="form" class="form-control" placeholder="{{'datas.form' | translate}}" 
                [(ngModel)]="addModel.form" required />
        <input id="substance" name="substance" class="form-control" placeholder="{{'datas.substance' | translate}}" 
                [(ngModel)]="addModel.substance" required />
        <button type="submit" class="btn btn-primary" id="add">+</button>
      </div>
    </form>
    <div class="search-container">
      <input
        id="searchInput"
        #searchInput
        class="form-control"
        (input)="filterTable($event)"
        autocomplete="off"
        placeholder="{{'mymeds.search' | translate}}"
      />
    </div>

    <div class="table-responsive">
      <table class="table table-striped">
          <thead>
            <tr>
              <th>{{'log.name' | translate}}</th>
              <th>{{'datas.form' | translate}}</th>
              <th>{{'datas.substance' | translate}}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let data of filteredDatas" [attr.data-name]="data.name">
              <td>
                <span *ngIf="editingData?.id !== data.id">{{ data.name }}</span>
                <input *ngIf="editingData?.id === data.id" 
                       type="text" 
                       class="form-control"
                       [(ngModel)]="editingData.name">
              </td>
              <td>
                <span *ngIf="editingData?.id !== data.id">{{ data.form }}</span>
                <input *ngIf="editingData?.id === data.id" 
                       type="text" 
                       class="form-control"
                       [(ngModel)]="editingData.form">
              </td>
              <td>
                <span *ngIf="editingData?.id !== data.id">{{ data.substance }}</span>
                <input *ngIf="editingData?.id === data.id" 
                       type="text" 
                       class="form-control"
                       [(ngModel)]="editingData.substance">
              </td>
              <td>
                <div class="buttons">
                  <button class="btn btn-warning btn-sm" 
                          *ngIf="editingData?.id !== data.id"
                          (click)="updateMedicine(data)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-success btn-sm" 
                          *ngIf="editingData?.id === data.id"
                          (click)="saveMedicine(data)">
                    <i class="bi bi-floppy"></i>
                  </button>
                  <button class="btn btn-secondary btn-sm" 
                          *ngIf="editingData?.id === data.id"
                          (click)="cancelEdit()">
                    <i class="bi bi-x"></i>
                  </button>
                  <button class="btn btn-danger btn-sm" 
                          *ngIf="editingData?.id !== data.id"
                          (click)="deleteMedicine(data)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
      </table>
    </div>
  </div>
</div>

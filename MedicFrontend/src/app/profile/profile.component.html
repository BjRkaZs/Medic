<div class="parent" *ngIf="isLoggedIn"> 
    <div class="container">
        <form>
            <div class="profpic">
                <img id="profilePic" [src]="profilePicUrl || 'default-profile.png'" class="profilePic">
                <label for="fileInput" class="upload-icon">+</label>
                <input type="file" id="fileInput" accept="image/*" (change)="onFileChange($event)">
            </div>
            

            <h1>{{ 'profile.profile' | translate }}</h1>
            <input type="text" class="form-control" id="displayName" placeholder="{{ 'profile.displayname' | translate }}" [(ngModel)]="user.name" name="name">
            <input type="email" class="form-control" id="email" placeholder="Email" [(ngModel)]="user.email" name="email" readonly>
            <div class="button-container">
                <button class="btn btn-sm" id="save" (click)="saveProfile()">{{ 'profile.save' | translate }}</button>
                <button class="btn btn-sm" id="delete" (click)="deleteProfile()">{{ 'profile.delete' | translate }}</button>
            </div>
        </form>
    </div>
</div>
